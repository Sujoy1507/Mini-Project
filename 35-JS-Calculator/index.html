<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <section class="body">
                <div class="display">
                    <p class="result">0</p>
                    <p class="first-val">0</p>
                    <p class="second-val">0</p>
                </div>
                <div class="switches">
                    <div class="key number key1">1</div>
                    <div class="key number key2">2</div>
                    <div class="key number key3">3</div>
                    <div class="key number key4">4</div>
                    <div class="key number key5">5</div>
                    <div class="key number key6">6</div>
                    <div class="key number key7">7</div>
                    <div class="key number key8">8</div>
                    <div class="key number key9">9</div>
                    <div class="key number key0">0</div>
                    <div class="key dot number key-dot">.</div>
                    <div class="key operator operator-plus">+</div>
                    <div class="key operator operator-minus">-</div>
                    <div class="key operator operator-multply">*</div>
                    <div class="key operator operator-devide">/</div>
                    <div class="key other enter">Enter</div>
                    <div class="key other clear">Clear</div>
                    <div class="key other all-clear">Ac</div>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
